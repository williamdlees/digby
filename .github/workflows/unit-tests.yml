name: Unit tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --project tsconfig.json --noEmit
      - run: npx tsc --project tsconfig.spec.json --noEmit
      - run: npm run test:coverage
